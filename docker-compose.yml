services:
  mysql:
    image: mysql:8.4
    container_name: obrigacoes-mysql
    environment:
      MYSQL_DATABASE: obrigacoes
      MYSQL_USER: obrigacoes
      MYSQL_PASSWORD: obrigacoes
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uobrigacoes", "-pobrigacoes"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: obrigacoes-api
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/obrigacoes?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: obrigacoes
      SPRING_DATASOURCE_PASSWORD: obrigacoes
      STORAGE_PATH: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads

volumes:
  mysql_data:
  uploads_data:
